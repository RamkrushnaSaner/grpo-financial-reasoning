name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[dev]" pytest-github-actions-annotate-failures
      - name: Lint
        run: ruff check src tests tools
      - name: Tests
        run: python -m pytest
      - name: Mathematical validation
        run: grpo validate
      - name: Full pipeline on the tiny CPU model
        run: grpo run configs/cpu_smoke.yaml

  hf-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with Hugging Face extras (no bitsandbytes)
        run: pip install -e ".[dev]" "transformers>=4.44" "peft>=0.12" "accelerate>=0.33"
      - name: Hugging Face + peft code path on a tiny local Qwen2
        run: python -m pytest tests/test_hf_integration.py
